name: htmlq
title: htmlq
summary: Like jq, but for HTML. 
description: |
  Like jq, but for HTML. Uses CSS selectors to extract bits of content from HTML files.
license: MIT

contact:
  - https://github.com/barryprice
issues:
  - https://github.com/barryprice/snap-htmlq/issues
source-code:
  - https://github.com/mgdm/htmlq
website:
  - https://github.com/mgdm/htmlq

adopt-info: htmlq
confinement: strict
grade: stable
base: core26

apps:
  htmlq:
    command: bin/htmlq

parts:
  htmlq:
    plugin: rust
    rust-channel: stable
    source: https://github.com/mgdm/htmlq.git
    build-packages: [cargo, rustc]
    override-build: |
      # Pinned upstream release tag. Renovate bumps this line automatically
      # when mgdm/htmlq publishes a new release (see renovate.json).
      # renovate: datasource=github-releases depName=mgdm/htmlq
      htmlq_version="v0.4.0"
      git checkout "${htmlq_version}"
      craftctl set version="${htmlq_version#v}"
      craftctl default
